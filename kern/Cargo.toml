[package]
name = "kern"
version = "0.1.0"
edition = "2024"

[lib]
name = "kern"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait.workspace = true
axum = { workspace = true, features = ["json"], optional = true }
chrono = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
ddd_macros = { version = "0.1.0", path = "../ddd_macros" }
serde = { workspace = true, features = ["derive"], optional = true }
tokio = { workspace = true , features = ["sync"], optional = true }
time = { workspace = true, features = ["formatting", "parsing"], optional = true }
utoipa = { workspace = true, features = ["macros"] }
uuid = { workspace = true, features = ["v4", "v7"] }
validator = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
tokio.workspace = true

[features]
axum = ["dep:axum", "serde"]
chrono = ["dep:chrono"]
chrono-serde = ["chrono", "serde", "chrono/serde"]
event_bus = ["dep:dashmap", "dep:tokio"]
serde = ["dep:serde", "uuid/serde", "ddd_macros/serde"]
time = ["dep:time"]
time-serde = ["time", "serde", "time/serde"]
validator = ["dep:validator"]
utoipa = []
